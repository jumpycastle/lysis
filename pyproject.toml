[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lysis-threatmodelagent"
version = "0.3.6"
description = "Lysis — AI threat model agent that breaks a system design open to expose its threats"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "anthropic>=0.60",
  "pydantic>=2.6",
  "pyyaml>=6",
  "python-docx>=1.1",
  "pypdf>=4",
  "python-pptx>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lysis = "lysis_threatmodelagent.cli:main"
ctm = "lysis_threatmodelagent.cli:main"   # backward-compatible alias

[tool.setuptools.packages.find]
include = ["lysis_threatmodelagent*"]

[tool.setuptools.package-data]
"lysis_threatmodelagent.prompts" = ["*.md"]
